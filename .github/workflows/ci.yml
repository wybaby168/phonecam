name: Test and build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  linux-core:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: swift:6.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Core tests
        run: swift test
  macos-build:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Core, media, tooling tests and unsigned app build
        run: scripts/test.sh
      - name: Preserve app bundle permissions in a development archive
        run: ditto -c -k --keepParent dist/PhoneCam.app dist/PhoneCam-macos-development.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-macos-development-build
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/PhoneCam-macos-development.zip
            dist/build-mode.txt
# No signing certificate is stored here. Unsigned CI artifacts cannot activate camera system extensions.
